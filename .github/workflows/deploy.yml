name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # Publish the root installer at https://openirlnodekit.com/install.sh
      # (single source: repo-root install.sh).
      - run: cp install.sh website/public/install.sh
      # Publish branding assets for download from the footer.
      - run: cp branding_assets/oink_branding_assets.zip website/public/oink_branding_assets.zip
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          # Custom apex domain → served at root (no subpath base)
          SITE_URL: https://openirlnodekit.com/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
