#cloud-config
# Example cloud-init user-data for an unattended OpenIRLNodeKit install.

write_files:
  - path: /tmp/oink-setup.sh
    owner: ubuntu:ubuntu
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Clone into an empty directory.
      git clone https://github.com/OpenIRLNodeKit/OINK /opt/OpenIRLNodeKit

      # Move the config into the repo and lock it down.
      mv /tmp/oink.conf /opt/OpenIRLNodeKit/oink.conf
      chmod 600 /opt/OpenIRLNodeKit/oink.conf

      # Install: host phase + native stack, non-interactive.
      python3 /opt/OpenIRLNodeKit/oink.py -c /opt/OpenIRLNodeKit/oink.conf setup -y

  - path: /tmp/oink.conf
    owner: root:root
    permissions: '0600'
    content: |
      # Dashboard auth
      export OINK_ADMIN_PASSWORD=change-me-to-a-strong-password

      # Runtime account (must be set before the first setup)
      export OINK_OBS_USER=obsuser

      # Ingest stream key: 20+ chars of [A-Za-z0-9_-]; blank = generated
      export OINK_INGEST_KEY=

      # Platform broadcast outputs (seeded once at first boot)
      export OINK_PRIMARY_PLATFORM=twitch
      export OINK_TWITCH_CHANNEL=
      export OINK_VIDEO_PRESET=
      export OINK_TWITCH_STREAM_KEY=
      export OINK_YOUTUBE_STREAM_KEY=
      export OINK_KICK_STREAM_KEY=

      # NOALBS Twitch chat bot
      export OINK_TWITCH_BOT_USERNAME=
      export OINK_TWITCH_BOT_OAUTH=oauth:

# Refresh apt lists once before the packages below are installed.
package_update: true
# Do NOT set package_upgrade: cloud-init runs `apt-get dist-upgrade`, which
# installs a new kernel the running box is not on yet; OINK then provisions
# v4l2loopback against the old running kernel and the virtual camera breaks on
# the next reboot (see scripts/sections.py §1).
#
# Third-party apt sources, added by cloud-init's apt module (config stage, so
# they exist before `packages:` installs in the final stage). Mirrors the repos
# scripts/sections.py §1 adds, so `oink setup` finds everything installed and
# skips its own apt pass. Keys are fetched from keyserver.ubuntu.com.
apt:
  sources:
    obs-studio:
      source: "deb [signed-by=$KEY_FILE] https://ppa.launchpadcontent.net/obsproject/obs-studio/ubuntu $RELEASE main"
      keyid: BC7345F522079769F5BBE987EFC71127F425E228
      keyserver: keyserver.ubuntu.com
    nodesource:
      source: "deb [signed-by=$KEY_FILE] https://deb.nodesource.com/node_22.x nodistro main"
      keyid: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
      keyserver: keyserver.ubuntu.com

# Keep this list in sync with scripts/constants.py.
packages:
  # Base / tooling
  - git
  - curl
  - ca-certificates
  - gnupg
  - openssl
  # Display / VNC
  - xserver-xorg-core
  - xserver-xorg-video-dummy
  - x11-xserver-utils
  - x11-utils
  - x11vnc
  # Media / runtime
  - ffmpeg
  - fonts-dejavu-core
  - xdotool
  - python3-websocket
  - ubuntu-drivers-common
  # SRTLA receiver build toolchain
  - cmake
  - build-essential
  # OBS virtual camera
  - v4l2loopback-dkms
  - v4l2loopback-utils
  # Archives (dashboard backups + plugin uploads)
  - zip
  - unzip
  - xz-utils
  - bzip2
  # guacd (remote desktop)
  - guacd
  - libguac-client-vnc0t64
  # Reverse proxy + security
  - nginx
  - fail2ban
  - nftables
  # Third-party repos (declared under `apt.sources` above)
  - obs-studio
  - nodejs

runcmd:
  - [bash, /tmp/oink-setup.sh]
