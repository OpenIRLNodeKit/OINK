# OINK Nginx reverse proxy + static file server (:__OINK_WEB_PORT__)
#
# Nginx does NOT auto-upgrade WebSocket connections: every proxied upstream
# that speaks WebSocket MUST set the Upgrade/Connection headers and speak
# HTTP/1.1 (see the /api/logs/ location below). The live log tail (/api/logs/*)
# silently hangs if those headers are omitted.
#
# The stack phase renders this file from the repo template, substituting the
# __WEB_ROOT__, __TMP_DIR__, __OINK_USER__, and __OINK_WEB_PORT__ placeholders
# with the installed SPA path, an obs_user-owned scratch dir, the runtime user
# on this host, and the dashboard listen port.
# The web UI, log-server, the guac tunnel, and guacd all run on the same host,
# so every upstream resolves on loopback.

# Master runs as root (binds the unprivileged dashboard port); workers drop to
# the stack runtime user so the installed SPA under the obsuser-owned stack tree
# stays readable.
# daemon off keeps the master in the foreground so systemd tracks it as the unit's
# main process (nginx otherwise forks into the background and systemd restarts it).
daemon off;
user __OINK_USER__;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Scratch dirs live under __TMP_DIR__ (created + chowned to the runtime user
    # by the stack phase) so the non-root workers can buffer request
    # bodies/uploads — the apt default /var/lib/nginx is root-owned.
    client_body_temp_path __TMP_DIR__/client_body;
    proxy_temp_path __TMP_DIR__/proxy;

    # Security headers applied to every response (web UI and proxied /api/*).
    add_header X-Content-Type-Options "nosniff" always;
    # Keep the private dashboard out of search indexes (robots.txt only covers
    # compliant crawlers; this header covers the rest and non-HTML responses).
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The dashboard is never framed by another origin, and outbound requests
    # need no referrer.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Content-Security-Policy for the dashboard SPA. __CSP_SCRIPT_SRC__ is the
    # script-src value computed by scripts/stack.py from the installed index.html:
    # it carries a sha256 hash per inline bootstrap script (React Router/Vite),
    # so 'unsafe-inline' is not needed. style-src is 'self' — the app has no
    # inline <style> or style attributes in its shipped HTML (React sets styles
    # via the CSSOM, which CSP does not block). The preview is framed from this
    # same origin (proxied below), so frame-src is 'self'; connect-src allows
    # the same-origin /api/logs and /guacws WebSockets. Hashes are regenerated on
    # every `oink setup` (build-coupled).
    add_header Content-Security-Policy "default-src 'self'; script-src __CSP_SCRIPT_SRC__; style-src __CSP_STYLE_SRC__; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self' ws: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS only when the operator fronts the box with a TLS terminator.
    __HSTS_HEADER__

    # Combined-format access log (real client IP after real-IP resolution) so
    # fail2ban can ban repeated dashboard-login failures. Lives in the
    # obsuser-owned scratch dir; rotated by /etc/logrotate.d/oink-nginx.
    access_log __TMP_DIR__/oink-access.log combined;

    # Real client IP when OINK_TRUSTED_PROXIES is set (fronting proxy).
    __TRUSTED_PROXY_BLOCK__

    # Performance: no buffering for proxied responses so the live log tail and
    # socket streams arrive as they are produced.
    proxy_buffering off;

    # Single server on :__OINK_WEB_PORT__ (non-privileged; 80/443 are left to
    # an external reverse proxy for TLS).
    server {
        listen __OINK_WEB_PORT__;
        server_name _;

        # ── Live log tail (WebSocket) → log-server ──────────────────────────
        # Longest-prefix match wins, so this overrides the generic /api/ block.
        location /api/logs/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # Overwrite (never append) so a client-supplied X-Forwarded-For
            # cannot spoof the rate-limit / audit IP the API trusts.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Controller status events (WebSocket) → oink-api ──────────────────
        # Same upgrade dance as /api/logs/ above: the generic /api/ block does
        # not set Upgrade/Connection, so a WebSocket here would silently hang.
        location = /api/ws {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Backup restore upload (larger body + no request buffering) ───────
        # Exact match so it wins over the generic /api/ block. Backups can carry
        # assets/recordings, so the default 1m body limit does not apply.
        location = /api/backup/restore {
            client_max_body_size 2g;
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
        }

        # ── API + health control plane → log-server (8082) ───────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /health {
            proxy_pass http://127.0.0.1:8082;
        }

        # ── OBS preview + Remote OBS, served same-origin ─────────────────────
        # The dashboard embeds the preview in an iframe and links to the full
        # Remote OBS client. Serving both from the dashboard origin (instead of
        # the browser reaching the guac server on :8081/:8080 directly) avoids
        # mixed-content blocking when the dashboard sits behind a TLS proxy, and
        # lets the browser reach them over the one proxied port. The guac pages
        # use relative asset/API paths and a same-origin `/guacws/` socket.
        #
        # These pages are our own static HTML with inline scripts, so they need
        # their own CSP (the dashboard's per-build script hashes do not apply)
        # and must NOT inherit `X-Frame-Options: DENY` — defining add_header in
        # a location cancels the parent's, which is exactly what we want here.
        # `frame-ancestors 'self'` still stops any other origin framing them.
        location = /preview-client {
            proxy_pass http://127.0.0.1:8081/preview;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }
        location = /preview-dashboard {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }
        location = /guac.js {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
        location = /remote {
            return 301 /remote/;
        }
        location /remote/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }
        # guac tunnel WebSocket (guacamole-lite on :8080). Same upgrade dance as
        # /api/logs/ above; proxy_pass trailing slash maps /guacws/ → /.
        location /guacws/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ── Static React Router SPA dashboard ────────────────────────────────
        # try_files gives {path} → {path}/index.html → /index.html so client-side
        # routes work without a server-side route table.
        location / {
            root __WEB_ROOT__;
            try_files $uri $uri/index.html /index.html;
            index index.html;
        }
    }
}
