Section "Device"
    Identifier "oink-dummy"
    Driver     "dummy"
    VideoRam   262144
EndSection

Section "Monitor"
    Identifier  "oink-monitor"
    HorizSync   30-70
    VertRefresh 50-75
    Modeline    "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Screen"
    Identifier   "oink-screen"
    Device       "oink-dummy"
    Monitor      "oink-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection
