# OpenIRLNodeKit: rotate the nginx dashboard access log that fail2ban tails.
# copytruncate keeps fail2ban reading the same inode (nginx holds the fd open).
# Installed to /etc/logrotate.d/oink-nginx by `oink setup` §5.
__TMP_DIR__/oink-access.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
