# OpenIRLNodeKit: fail2ban filter for dashboard-login brute force.
#
# Nginx writes a combined-format access log (see stack/nginx.conf) with the real
# client IP after real-IP resolution, so <HOST> is the actual client. The filter
# matches only failed (401) / forbidden (403) logins on the auth route.
#
# Installed to /etc/fail2ban/filter.d/oink-auth.conf by `oink setup` §5.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/auth/login[^"]*" 40[13]\b
ignoreregex =
