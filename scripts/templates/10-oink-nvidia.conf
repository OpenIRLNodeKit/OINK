# Headless Xorg on the NVIDIA GPU: no monitor attached, keep serving :99 at
# 1920x1080 so OBS renders on the GPU instead of llvmpipe and the remote
# desktop has a usable full-size screen.
Section "Device"
    Identifier  "oink-nvidia"
    Driver      "nvidia"
    BusID       "$NVIDIA_BUSID"
    Option      "AllowEmptyInitialConfiguration" "true"
    # Pretend a display is attached so the driver accepts the modeline below.
    Option      "ConnectedMonitor" "DFP-0"
    Option      "ModeValidation" "AllowNonEdidModes"
EndSection

Section "Monitor"
    Identifier  "oink-monitor"
    HorizSync   30-70
    VertRefresh 50-75
    Modeline    "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Screen"
    Identifier   "oink-screen"
    Device       "oink-nvidia"
    Monitor      "oink-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection
